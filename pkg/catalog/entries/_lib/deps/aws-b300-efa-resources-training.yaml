# AWS B300 (p6-b300.48xlarge) training resources: 8 GPUs and 16 EFA devices.
# The instance has 17 network cards; card 0 is a plain ENA and is not
# EFA-capable, so request 16 devices rather than the 32 used by p5 H100
# (see deps/aws-b300-efa-runtime-patch-comm.yaml for the same reasoning on
# the comm entries).
#
# CPU and memory follow the p5 H100 fragment. They are schedulable on the
# 192 vCPU / 4 TiB instance but are not measured B300 requirements; size
# them from allocatable capacity and observed peak use once the first
# two-node smoke has run. Do not raise them to the instance total: the
# runtime and DaemonSets need headroom.
- apiVersion: trainer.kubeflow.org/v1alpha1
  kind: TrainingRuntime
  metadata:
    name: {{ .EntryName }}-runtime
  spec:
    mlPolicy:
      numNodes: {{ .NodesPerJob }}
      torch:
        numProcPerNode: {{ .GpusPerNode }}
    template:
      spec:
        replicatedJobs:
        - name: node
          template:
            spec:
              template:
                spec:
                  containers:
                  - name: node
                    securityContext:
                      capabilities:
                        add:
                        - IPC_LOCK
                    resources:
                      limits:
                        nvidia.com/gpu: "{{ .GpusPerNode }}"
                        vpc.amazonaws.com/efa: 16
                        memory: 1800Gi
                        cpu: "192"
                      requests:
                        nvidia.com/gpu: "{{ .GpusPerNode }}"
                        vpc.amazonaws.com/efa: 16
                        memory: 1200Gi
                        cpu: "128"
